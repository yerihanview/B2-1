name: Python Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10 unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run nonempty unit and integration suite
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          discovered = suite.countTestCases()
          if discovered == 0:
              raise SystemExit("No test cases discovered. CI cannot pass without tests.")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          skipped = len(result.skipped)
          print(f"discovered={discovered}, run={result.testsRun}, "
                f"failures={len(result.failures)}, errors={len(result.errors)}, "
                f"skipped={skipped}, expected_failures={len(result.expectedFailures)}, "
                f"unexpected_successes={len(result.unexpectedSuccesses)}")
          sys.exit(0 if result.wasSuccessful() and result.testsRun > skipped else 1)
          PY
