<text x="726" y="374" text-anchor="middle" font-family="Noto Sans CJK KR" font-weight="400" font-size="19" fill="#15283b">업무 규칙 실행</text>
<text x="726" y="404" text-anchor="middle" font-family="Noto Sans CJK KR" font-weight="400" font-size="19" fill="#15283b">기능별 작업 조정</text>
