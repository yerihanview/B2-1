<text x="116" y="802" text-anchor="start" font-family="Noto Sans CJK KR" font-weight="400" font-size="18" fill="#15283b">기능을 이해하기 쉽고, 변경 시 영향 범위를 줄이며, 각 부분을 독립적으로 검증할 수 있다.</text>
<text x="90" y="858" text-anchor="start" font-family="Noto Sans CJK KR" font-weight="400" font-size="16" fill="#64748b">※ 화살표는 주요 협력 관계를 단순화해 표현한 것으로, 실제 모든 함수 호출을 뜻하지는 않는다.</text>
