<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><title>T1 클래스·모듈화와 책임 분리</title><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#50687c"/></marker></defs>
<rect x="0" y="0" width="1280" height="900" rx="0" fill="#f7fafd" stroke="none" stroke-width="0"/>
