<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-label="T2 파일 기반 영속성: 데이터가 메모리에서 JSONL 파일로 저장되고 프로그램 재실행 후 다시 복원되는 과정"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#496481"/></marker><marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#1d8b72"/></marker><style>
text{font-family:'Noto Sans CJK KR','Noto Sans KR','NanumSquare','Malgun Gothic',sans-serif;fill:#172b45} .title{font-size:37px;font-weight:800}.sub{font-size:20px;fill:#52657b}.h{font-size:26px;font-weight:800}.mid{font-size:23px;font-weight:700}.body{font-size:19px;font-weight:500}.small{font-size:17px;fill:#44546a}.tiny{font-size:15px;fill:#516177}.mono{font-family:'DejaVu Sans Mono',monospace;font-size:17px;fill:#1a4b76}.arrow{stroke:#496481;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.greenarrow{stroke:#1d8b72;stroke-width:3.5;fill:none;marker-end:url(#arrowG)}</style></defs><rect x="0" y="0" width="1440" height="950" rx="0" fill="#f7faff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1440" height="142" rx="0" fill="#162e50" stroke="none" stroke-width="1.5"/><rect x="55" y="35" width="74" height="63" rx="17" fill="#2f7292" stroke="none" stroke-width="1.5"/><text x="92" y="78" class="h" text-anchor="middle">T2</text><style>.head{font-family:"Noto Sans CJK KR",sans-serif;font-size:37px;font-weight:800;fill:white}.headsub{font-family:"Noto Sans CJK KR",sans-serif;font-size:19px;fill:#d9e7f5}.white{fill:white}</style><text x="150" y="70" class="head">파일 기반 영속성</text><text x="152" y="111" class="headsub">프로그램이 종료되어도 거래 데이터가 남는 원리 · B2-1의 JSONL 저장 구조</text><rect x="40" y="170" width="1360" height="448" rx="22" fill="#ffffff" stroke="#dce7f1" stroke-width="1.5"/><rect x="64" y="188" width="33" height="33" rx="9" fill="#dbeafe" stroke="none" stroke-width="1.5"/><text x="80" y="211" class="mid" text-anchor="middle">1</text><text x="112" y="214" class="h" text-anchor="start">전체 동작 : 저장 → 종료 → 재실행</text><rect x="65" y="259" width="230" height="207" rx="18" fill="#e9f5fc" stroke="#8dc8e6" stroke-width="1.5"/><text x="180" y="301" class="mid" text-anchor="middle">사용자 입력</text><text x="180" y="338" class="body" text-anchor="middle">거래 1건 추가</text><rect x="94" y="356" width="172" height="59" rx="10" fill="#ffffff" stroke="#c8e4f1" stroke-width="1.5"/><text x="180" y="381" class="small" text-anchor="middle">날짜 · 금액</text><text x="180" y="401" class="small" text-anchor="middle">카테고리 · 메모</text><rect x="359" y="259" width="260" height="207" rx="18" fill="#fff1d9" stroke="#edc17e" stroke-width="1.5"/><text x="489" y="301" class="mid" text-anchor="middle">프로그램 메모리</text><text x="489" y="336" class="body" text-anchor="middle">거래 객체 생성</text><text x="489" y="370" class="small" text-anchor="middle">실행 중에만 유지</text><rect x="395" y="393" width="189" height="47" rx="9" fill="#fff9f0" stroke="#f0d9b5" stroke-width="1.5"/><text x="489" y="423" class="body" text-anchor="middle">종료하면 사라짐</text><rect x="687" y="259" width="279" height="207" rx="18" fill="#eae7fd" stroke="#c0b3ec" stroke-width="1.5"/><text x="827" y="301" class="mid" text-anchor="middle">Repository</text><text x="827" y="335" class="body" text-anchor="middle">검증된 거래를</text><text x="827" y="364" class="body" text-anchor="middle">파일 형식으로 기록</text><rect x="723" y="392" width="207" height="49" rx="10" fill="#ffffff" stroke="#d3caef" stroke-width="1.5"/><text x="827" y="422" class="body" text-anchor="middle">파일 I/O 담당</text><rect x="1032" y="259" width="333" height="207" rx="18" fill="#dcf6ec" stroke="#7acbb3" stroke-width="1.5"/><text x="1198" y="300" class="mid" text-anchor="middle">디스크의 JSONL 파일</text><text x="1198" y="338" class="mono" text-anchor="middle">transactions.jsonl</text><path d="M1065 363 L1330 363" stroke="#8ed7bf" stroke-width="1.5" fill="none"/><text x="1198" y="392" class="body" text-anchor="middle">거래 A</text><text x="1198" y="424" class="body" text-anchor="middle">거래 B · 거래 C ...</text><path d="M295 360 H350" class="arrow"/><path d="M619 360 H680" class="arrow"/><path d="M966 360 H1023" class="arrow"/><text x="659" y="347" class="tiny" text-anchor="middle">저장</text><rect x="77" y="493" width="1286" height="93" rx="15" fill="#f1f8fe" stroke="#cbddeb" stroke-width="1.5"/><text x="112" y="527" class="mid" text-anchor="start">프로그램 종료</text><text x="112" y="555" class="small" text-anchor="start">메모리의 거래 객체 소멸</text><path d="M375 539 H487" class="arrow"/><text x="513" y="527" class="mid" text-anchor="start">프로그램 재실행</text><text x="513" y="555" class="small" text-anchor="start">Repository가 파일을 다시 읽음</text><path d="M841 539 H932" class="arrow"/><text x="963" y="527" class="mid" text-anchor="start">기존 거래 복원</text><text x="963" y="555" class="small" text-anchor="start">새 실행에서도 조회 가능</text><rect x="40" y="644" width="825" height="258" rx="20" fill="#ffffff" stroke="#dce7f1" stroke-width="1.5"/><rect x="65" y="665" width="33" height="33" rx="9" fill="#e1f7ec" stroke="none" stroke-width="1.5"/><text x="81" y="688" class="mid" text-anchor="middle">2</text><text x="112" y="690" class="h" text-anchor="start">B2-1의 영구 저장 파일</text><rect x="75" y="718" width="350" height="52" rx="10" fill="#eff8ff" stroke="#d4e7f4" stroke-width="1.5"/><text x="97" y="749" class="mono" text-anchor="start">transactions.jsonl</text><text x="350" y="749" class="small" text-anchor="middle">거래 내역</text><rect x="75" y="780" width="350" height="45" rx="10" fill="#eff8ff" stroke="#d4e7f4" stroke-width="1.5"/><text x="97" y="808" class="mono" text-anchor="start">categories.jsonl</text><text x="353" y="808" class="small" text-anchor="middle">카테고리</text><rect x="75" y="834" width="350" height="45" rx="10" fill="#eff8ff" stroke="#d4e7f4" stroke-width="1.5"/><text x="97" y="863" class="mono" text-anchor="start">budgets.jsonl</text><text x="352" y="863" class="small" text-anchor="middle">월 예산</text><rect x="445" y="718" width="390" height="161" rx="12" fill="#f9fbfd" stroke="#e2e8f0" stroke-width="1.5"/><text x="468" y="749" class="mid" text-anchor="start">JSONL의 특징</text><text x="468" y="788" class="body" text-anchor="start">• 한 줄에 데이터 한 건(JSON 객체)</text><text x="468" y="824" class="body" text-anchor="start">• 다음 실행에서 파일을 다시 읽어</text><text x="490" y="852" class="body" text-anchor="start">저장 상태를 복원</text><rect x="894" y="644" width="506" height="258" rx="20" fill="#ffffff" stroke="#dce7f1" stroke-width="1.5"/><rect x="919" y="665" width="33" height="33" rx="9" fill="#fff0d6" stroke="none" stroke-width="1.5"/><text x="935" y="688" class="mid" text-anchor="middle">3</text><text x="968" y="690" class="h" text-anchor="start">CSV와의 역할 차이</text><rect x="928" y="717" width="435" height="64" rx="12" fill="#e8f6ed" stroke="#b9e1c8" stroke-width="1.5"/><text x="950" y="742" class="body" text-anchor="start">JSONL = 프로그램의 영구 저장</text><text x="950" y="766" class="small" text-anchor="start">거래·카테고리·예산의 원본 데이터</text><rect x="928" y="796" width="435" height="78" rx="12" fill="#fef4e8" stroke="#f1d4ae" stroke-width="1.5"/><text x="950" y="824" class="body" text-anchor="start">CSV = 가져오기·내보내기용 교환 형식</text><text x="950" y="852" class="small" text-anchor="start">다른 파일의 거래를 가져오거나 공유</text><text x="720" y="931" class="body" text-anchor="middle">핵심: 메모리는 실행 중 작업 공간, 파일은 실행이 끝나도 데이터가 남는 저장 공간</text></svg>